services:
  - type: web
    name: dealarchive-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e . && alembic upgrade head
    startCommand: uvicorn dealarchive.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_DIR
        value: /opt/render/project/storage
      - key: INBOUND_EMAIL_DOMAIN
        sync: false
      - key: INBOUND_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
