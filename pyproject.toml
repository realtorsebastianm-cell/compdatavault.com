[project]
name = "dealarchive"
version = "0.1.0"
description = "Deal Archive -- broker comp vault built from forwarded flyers"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "pyjwt[crypto]>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealarchive*"]
